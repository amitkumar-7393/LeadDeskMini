<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LeadDesk Admin Dashboard</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<script type="module"
src="firebase.js"></script>

<script type="module"
src="admin.js"></script>

</head>

<body>

<div class="dashboard">

<header>

<div class="logo">

<i class="fa-solid fa-layer-group"></i>

<h2>LeadDesk Admin</h2>

</div>

<button id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</header>

<section class="login-card">

<h1>

Admin Login

</h1>

<p>

Sign in to manage leads

</p>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

</section>

<section class="lead-section">

<h2>

<i class="fa-solid fa-users"></i>

Manage Leads

</h2>

<input
type="text"
id="search"
placeholder="Search by name or email...">

<p id="loading">

Loading leads...

</p>

<div id="leadList">
  </div>

</section>

<footer>

<p>

LeadDesk Mini Admin Dashboard

</p>

<p>

Built for

<a
href="https://digitalheroesco.com"
target="_blank">

Digital Heroes Training Task

</a>

</p>

</footer>

</div>

</body>

</html>
